[project]
name = "alfred-emoji-search"
version = "2026.7.2"
description = "Alfred workflow for emoji lookup by shortcode and description"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alfred-workflow",
    "em-keyboard",
]

[dependency-groups]
dev = [
    "bumpver",
]

[tool.uv]
package = false

[tool.bumpver]
current_version = "2026.7.2"
version_pattern = "YYYY.MM.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/main.py" = [
    'VERSION = "{version}"',
]
"info.plist" = [
    '{version}',
]
"update.json" = [
    '"version": "{version}"',
]
